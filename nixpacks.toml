[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"
PYTHONUNBUFFERED = "1"
MPLBACKEND = "Agg"

[phases.setup]
nixPkgs = ["python311", "freetype", "libpng", "zlib"]

[phases.install]
cmds = ["python -m pip install --upgrade pip", "python -m pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "python -u monarch_tgbot.py"